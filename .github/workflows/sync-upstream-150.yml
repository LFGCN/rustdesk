name: Sync upstream 1.5.0 into master

on:
  push:
    paths:
      - '.github/workflows/sync-upstream-150.yml'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout master (full history)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "LFGCN"
          git config user.email "198198842+LFGCN@users.noreply.github.com"

      - name: Fetch upstream 1.5.0
        run: |
          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch upstream refs/tags/1.5.0 --no-tags
          git tag upstream-1.5.0 FETCH_HEAD

      - name: Merge upstream 1.5.0 (keep our .github)
        run: |
          set -e
          OUT=$(git merge upstream-1.5.0 --no-commit 2>&1) || true
          if echo "$OUT" | grep -q 'Already up to date'; then
            echo 'already merged'
          else
            git checkout HEAD -- .github
            git checkout --theirs -- Cargo.toml Cargo.lock || true
            git add -A
            UNRESOLVED=$(git diff --name-only --diff-filter=U)
            if [ -n "$UNRESOLVED" ]; then
              echo "::error::Unresolved conflicts:"
              echo "$UNRESOLVED"
              exit 1
            fi
            git commit -m "Merge upstream 1.5.0 into master (keep .github)"
          fi
          git log -1 --format='HEAD: %H %s'

      - name: Verify patch patterns still present
        run: |
          set -e
          git submodule update --init libs/hbb_common
          grep -qF 'rs-ny.rustdesk.com' libs/hbb_common/src/config.rs
          grep -qF 'OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=' libs/hbb_common/src/config.rs
          grep -qF '"https://admin.rustdesk.com".to_owned()' src/common.rs
          echo 'all patch patterns present'

      - name: Push master (with diagnostics)
        run: |
          set -e
          git remote -v
          if ! OUT=$(git push origin HEAD:master 2>&1); then
            echo "$OUT"
            FLAT=$(echo "$OUT" | tr '\n' '|')
            echo "::error::PUSH FAILED: $FLAT"
            exit 1
          fi
          echo "$OUT"
          echo 'master pushed'

      - name: Tag v1.5.0-1 only when 1.5.0 build workflow is adopted
        run: |
          set -e
          if ! grep -q 'build-rustdesk-linux-drm' .github/workflows/flutter-build.yml; then
            echo 'flutter-build.yml is not the adopted 1.5.0 version yet, skip tagging'
            exit 0
          fi
          if git ls-remote --exit-code origin refs/tags/v1.5.0-1 >/dev/null 2>&1; then
            echo 'tag v1.5.0-1 already exists, skip'
            exit 0
          fi
          git tag v1.5.0-1
          if ! OUT=$(git push origin v1.5.0-1 2>&1); then
            echo "$OUT"
            FLAT=$(echo "$OUT" | tr '\n' '|')
            echo "::error::TAG PUSH FAILED: $FLAT"
            exit 1
          fi
          echo "$OUT"
          echo 'tag pushed, release build triggered'
