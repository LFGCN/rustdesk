name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' 
      - '[0-9]+.[0-9]+.[0-9]+' 
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+' 
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+' 

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "v1.5.0-1"
